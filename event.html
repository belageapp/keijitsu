<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>イベント詳細｜経営実践研究会 広島会員 情報共有アプリ</title>
<link rel="stylesheet" href="style.css">
<style>
  .ev-hero{padding:22px;margin-bottom:16px}
  .ev-hero h1{font-size:20px;font-weight:800;margin-bottom:10px}
  .ev-hero .meta-row{font-size:13px;color:var(--ink-mid);margin-bottom:5px;display:flex;gap:8px;align-items:center}
  .ev-hero .desc{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:14px;line-height:1.8;white-space:pre-wrap;color:var(--ink)}
  .sec{padding:18px 20px;margin-bottom:16px}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .sec-title{font-size:14px;font-weight:800;color:var(--ink)}
  .sec-title .ico{color:var(--gold);margin-right:5px}

  /* 出欠ボタン */
  .att-buttons{display:flex;gap:8px;margin-bottom:8px}
  .att-btn{flex:1;padding:11px;border:1.5px solid var(--border);border-radius:10px;background:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink-mid);transition:.15s}
  .att-btn.sel-attending{background:var(--green);border-color:var(--green);color:#fff}
  .att-btn.sel-absent{background:var(--red);border-color:var(--red);color:#fff}
  .att-btn.sel-undecided{background:var(--ink-light);border-color:var(--ink-light);color:#fff}

  /* 出欠一覧 */
  .att-group{margin-bottom:14px}
  .att-group-label{font-size:12px;font-weight:700;color:var(--ink-mid);margin-bottom:6px}
  .att-chips{display:flex;flex-wrap:wrap;gap:6px}
  .att-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:16px;font-size:12px;background:var(--bg);border:1px solid var(--border)}
  .att-chip a{font-weight:600}
  .att-chip .inviter{font-size:10px;color:var(--ink-light)}

  /* 役割 */
  .role-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
  .role-row:last-child{border-bottom:none}
  .role-name{font-weight:700;color:var(--indigo);min-width:110px}
  .role-people{flex:1;color:var(--ink)}

  /* 添付 */
  .attach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .attach-item{border:1px solid var(--border);border-radius:10px;overflow:hidden;position:relative;background:var(--bg)}
  .attach-item img{width:100%;height:110px;object-fit:cover;display:block;cursor:pointer}
  .attach-file{display:flex;flex-direction:column;align-items:center;justify-content:center;height:110px;font-size:12px;color:var(--ink-mid);text-align:center;padding:8px}
  .attach-name{font-size:10px;color:var(--ink-mid);padding:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .attach-del{position:absolute;top:4px;right:4px;background:rgba(58,52,43,.7);color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:12px;line-height:1}
  /* タブ */
  .ev-tabs{display:flex;gap:2px;border-bottom:2px solid var(--border);margin-bottom:16px;overflow-x:auto}
  .ev-tab{padding:10px 16px;font-size:13px;font-weight:700;color:var(--ink-mid);cursor:pointer;border:none;border-bottom:3px solid transparent;white-space:nowrap;background:none;font-family:inherit}
  .ev-tab.active{color:var(--indigo);border-bottom-color:var(--indigo)}
  /* 出欠セグメント */
  .att-field{margin-bottom:16px}
  .att-field > label{display:block;font-size:12px;font-weight:800;color:var(--ink-mid);margin-bottom:6px}
  .att-seg{display:flex;gap:6px}
  .att-seg label{flex:1;cursor:pointer}
  .att-seg input{display:none}
  .att-seg span{display:block;text-align:center;padding:9px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-weight:700;color:var(--ink-mid)}
  .att-seg input:checked + span.s-attending{background:var(--green);border-color:var(--green);color:#fff}
  .att-seg input:checked + span.s-undecided{background:var(--ink-light);border-color:var(--ink-light);color:#fff}
  .att-seg input:checked + span.s-absent{background:var(--red);border-color:var(--red);color:#fff}
  /* ゲスト/社員カード */
  .pcard{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;background:#FBFDFF}
  .pcard .pc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .pcard input,.pcard select,.pcard textarea{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;background:#fff;margin-bottom:8px}
  .pcard textarea{min-height:52px;resize:vertical}
  .chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink-mid);margin-right:14px;cursor:pointer}
  .chk input{width:15px;height:15px;margin:0}
  .pc-del{background:#fff;border:1.5px solid #E4C4C0;color:var(--red);font-size:11px;font-weight:700;cursor:pointer;padding:3px 10px;border-radius:7px}
  /* 参加状況 */
  .pstat-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;flex-wrap:wrap}
  .pstat-row:last-child{border-bottom:none}
  .pill-settled{font-size:10px;font-weight:700;padding:1px 7px;border-radius:9px;background:#E7F1EA;color:#2E7A54}
  .pill-guest{font-size:10px;font-weight:700;padding:1px 7px;border-radius:9px;background:#FBF0E1;color:#B0742A}
  .pill-emp{font-size:10px;font-weight:700;padding:1px 7px;border-radius:9px;background:#EAF0F6;color:#3A5A7A}
  /* 参加者テーブル */
  .ptable{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
  .ptable th{background:#F1F6FB;color:var(--ink-mid);font-weight:700;font-size:11px;padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
  .ptable th:first-child{text-align:left}
  .ptable td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--border);vertical-align:top}
  .ptable td:first-child{text-align:left}
  .ptable tr:last-child td{border-bottom:none}
  .ptable .g-toggle{cursor:pointer;color:var(--indigo);font-weight:600}
  .pdetail{background:#FBFDFF;font-size:12px;color:var(--ink-mid);text-align:left!important;line-height:1.9}
  .pdetail a{color:var(--gold-dark);word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html" class="nav-link" style="display:inline-block;margin-bottom:12px">← イベント一覧に戻る</a>
  <div id="content"><div class="loading">読み込み中...</div></div>
</div>

<!-- イベント編集モーダル -->
<div class="modal-ov" id="evEditModal">
  <div class="modal">
    <div class="modal-title">イベント編集</div>
    <div class="field"><label>タイトル <span style="color:var(--red)">*</span></label><input id="ee-title"></div>
    <div class="field"><label>イベント種別</label><select id="ee-type"></select></div>
    <div class="field" style="display:flex;gap:10px">
      <div style="flex:1"><label>開始日時 <span style="color:var(--red)">*</span></label><input type="datetime-local" id="ee-start"></div>
      <div style="flex:1"><label>終了日時</label><input type="datetime-local" id="ee-end"></div>
    </div>
    <div class="field"><label>開催場所</label><input id="ee-location"></div>
    <div class="field"><label>内容・概要</label><textarea id="ee-desc"></textarea></div>
    <div class="field"><label>役割分担表（GoogleスプレッドシートURL）</label><input id="ee-sheet" placeholder="https://docs.google.com/spreadsheets/..."><div class="hint">「リンクを知っている全員が閲覧可」または「ウェブに公開」で埋め込み表示されます。特定のタブを表示したい場合は、そのタブを開いた状態のURL（末尾 #gid=…）を貼り付けてください。</div></div>
    <div class="field"><label>K-PORTAL 決済URL（本部決済サイト）</label><input id="ee-kportal" placeholder="https://..."><div class="hint">イベントごとの本部決済ページのURL。出欠タブに決済ボタンとして表示されます。</div></div>
    <div class="field" id="ee-goal-wrap" style="display:none;gap:10px">
      <div style="flex:1"><label>本会 会員目標（人）</label><input type="number" id="ee-goal-mem" min="0"></div>
      <div style="flex:1"><label>本会 ゲスト目標（人）</label><input type="number" id="ee-goal-guest" min="0"></div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-outline" id="eeCancel">キャンセル</button>
      <button class="btn btn-primary" id="eeSave">保存する</button>
    </div>
  </div>
</div>

<!-- 役割編集モーダル -->
<div class="modal-ov" id="roleModal">
  <div class="modal">
    <div class="modal-title">役割の割り当て</div>
    <div class="field"><label>役割名 <span style="color:var(--red)">*</span></label><input id="role-name" placeholder="例：司会 / 受付 / 講師"></div>
    <div class="field"><label>担当者（複数選択可）</label>
      <div class="check-list" id="role-members" style="border:1.5px solid var(--border);border-radius:9px;max-height:200px;overflow-y:auto;padding:8px 12px"></div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-outline" id="roleCancel">キャンセル</button>
      <button class="btn btn-primary" id="roleSave">追加する</button>
    </div>
  </div>
</div>

<!-- 声かけ者変更モーダル -->
<div class="modal-ov" id="inviterModal">
  <div class="modal">
    <div class="modal-title">声かけ者の設定</div>
    <input type="hidden" id="inviter-target-uid">
    <div class="field"><label>このイベントの声かけ者</label>
      <select id="inviter-select"></select>
      <div class="hint">未設定の場合はプロフィールの声かけ者が適用されます</div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-outline" id="inviterCancel">キャンセル</button>
      <button class="btn btn-primary" id="inviterSave">保存する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { doc, getDoc, updateDoc, deleteDoc, collection, getDocs, setDoc, serverTimestamp }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
  import { ref, uploadBytes, getDownloadURL, deleteObject }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js';
  import { db, storage } from './firebase-config.js';
  import { requireAuth, renderTopbar, canEdit } from './auth.js';
  import { EVENT_TYPES, eventTypeBadge, INDUSTRIES, industryBadge, OTHER_CATEGORIES, MOBILIZATION_TYPES, eventTypeOptionsInner } from './constants.js';

  // 種別セレクトを構築
  document.getElementById('ee-type').innerHTML =
    '<option value="">（未設定）</option>' + eventTypeOptionsInner();

  const eventId = new URLSearchParams(location.search).get('id');
  let me = null, ev = null, members = [], memberMap = {}, attendance = [];
  let currentTab = 'overview';
  const industryOptions = (sel) => '<option value="">業種を選択</option>' + INDUSTRIES.map(i => `<option value="${i}"${i===sel?' selected':''}>${i}</option>`).join('');

  const WD = ['日','月','火','水','木','金','土'];
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function escAttr(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
  // GoogleスプレッドシートURLを「埋め込み（閲覧）」用に変換（gidで特定タブを表示）
  function sheetEmbedUrl(url){
    if(!url) return '';
    const gid = (url.match(/[#&?]gid=([0-9]+)/)||[])[1];
    // ウェブに公開（pubhtml）：gid があれば single=true でそのタブのみ表示
    if(url.includes('/pubhtml')){
      const base = url.split('#')[0];
      const params = [];
      if(gid){ params.push('gid='+gid); params.push('single=true'); }
      params.push('widget=true'); params.push('headers=false');
      return base + (base.includes('?')?'&':'?') + params.join('&');
    }
    if(url.includes('/pub')) return url;
    const m = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
    if(m){
      // gid 指定時は htmlembed（そのタブだけを確実に表示）／未指定は preview
      if(gid) return `https://docs.google.com/spreadsheets/d/${m[1]}/htmlembed?gid=${gid}`;
      return `https://docs.google.com/spreadsheets/d/${m[1]}/preview`;
    }
    return url;
  }
  // 「編集（Googleで開く）」用URL（該当タブを編集モードで開く）
  function sheetEditUrl(url){
    if(!url) return '';
    if(url.includes('/d/e/')) return url;  // ウェブ公開URLは編集用に変換できない
    const m = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
    if(m){
      const gid = (url.match(/[#&?]gid=([0-9]+)/)||[])[1];
      return `https://docs.google.com/spreadsheets/d/${m[1]}/edit${gid?('#gid='+gid):''}`;
    }
    return url;
  }
  function fmtDateTime(ts){
    const d = ts?.toDate ? ts.toDate() : (ts ? new Date(ts) : null);
    if (!d) return '日時未定';
    const p = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日(${WD[d.getDay()]}) ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  (async () => {
    if (!eventId) { location.href = 'index.html'; return; }
    me = await requireAuth();
    renderTopbar(me, 'events');
    await loadAll();
  })();

  async function loadAll() {
    try {
      const [evSnap, memSnap, attSnap] = await Promise.all([
        getDoc(doc(db, 'events', eventId)),
        getDocs(collection(db, 'users')),
        getDocs(collection(db, 'events', eventId, 'attendance')),
      ]);
      if (!evSnap.exists()) { document.getElementById('content').innerHTML = '<div class="empty">イベントが見つかりません</div>'; return; }
      ev = { id: evSnap.id, ...evSnap.data() };
      members = memSnap.docs.map(d => ({ uid: d.id, ...d.data() })).filter(m => !m.disabled);
      memberMap = {}; members.forEach(m => memberMap[m.uid] = m);
      attendance = attSnap.docs.map(d => ({ uid: d.id, ...d.data() }));
      // 旧形式(status)を main に正規化
      attendance.forEach(a => { if (a.main === undefined && a.status) a.main = a.status; });
      render();
    } catch (e) {
      document.getElementById('content').innerHTML = `<div class="empty" style="color:var(--red)">読み込みエラー：${e.message}</div>`;
    }
  }

  function myAttendance() { return attendance.find(a => a.uid === me.uid); }
  // 実効の声かけ者：イベント別 > プロフィール
  function effectiveInviter(uid) {
    const a = attendance.find(x => x.uid === uid);
    const invUid = a?.inviterUid || memberMap[uid]?.inviterUid;
    return invUid ? memberMap[invUid]?.name : null;
  }

  // ── 参加人数の集計 ──
  function computeSummary() {
    const s = { main:{members:0,guests:0,employees:0,others:0}, social:{members:0,guests:0,employees:0,others:0} };
    attendance.forEach(a => {
      if (a.main === 'attending') s.main.members++;
      if (a.social === 'attending') s.social.members++;
      (a.guests||[]).forEach(g => { if (g.joinMain) s.main.guests++; if (g.joinSocial) s.social.guests++; });
      (a.employees||[]).forEach(e => { if (e.joinMain) s.main.employees++; if (e.joinSocial) s.social.employees++; });
    });
    (ev.others||[]).forEach(o => { if (o.joinMain) s.main.others++; if (o.joinSocial) s.social.others++; });
    s.main.total = s.main.members+s.main.guests+s.main.employees+s.main.others;
    s.social.total = s.social.members+s.social.guests+s.social.employees+s.social.others;
    return s;
  }

  // 1本の動員バー
  function oneGoalBar(label, actual, goal) {
    const pct = goal > 0 ? Math.round(actual / goal * 100) : 0;
    const barPct = Math.min(100, pct);
    const reached = goal > 0 && actual >= goal;
    const rem = Math.max(0, goal - actual);
    return `<div style="margin-top:10px">
      <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px">
        <span style="color:var(--ink-mid)">${label} <strong>${actual}</strong> / 目標 ${goal}名</span>
        <span style="font-weight:800;color:${reached?'var(--green)':'var(--gold-dark)'}">${reached?'🎉達成':pct+'%'}</span>
      </div>
      <div style="height:11px;background:#E4EDF5;border-radius:6px;overflow:hidden">
        <div style="height:100%;width:${barPct}%;background:${reached?'var(--green)':'linear-gradient(90deg,#5BC0F0,#1C6BA8)'};transition:width .5s;border-radius:6px"></div>
      </div>
      ${!reached ? `<div style="font-size:11px;font-weight:700;color:var(--gold-dark);margin-top:3px">🔥 あと ${rem}名</div>` : ''}
    </div>`;
  }
  function summaryPanelHtml(sm) {
    const isMob = MOBILIZATION_TYPES.includes(ev.eventType);
    const goalMem = ev.goalMainMembers || 0;
    const goalGuest = ev.goalMainGuests || 0;
    const memPart = `会員 <strong>${sm.main.members}</strong>${(isMob&&goalMem)?` / 目標${goalMem}`:''}`;
    const guestPart = `ゲスト <strong>${sm.main.guests}</strong>${(isMob&&goalGuest)?` / 目標${goalGuest}`:''}`;
    const bars = isMob ? `
        ${goalMem ? oneGoalBar('👤 会員', sm.main.members, goalMem) : ''}
        ${goalGuest ? oneGoalBar('🎟 ゲスト', sm.main.guests, goalGuest) : ''}` : '';
    return `
      <div class="card" style="padding:16px;margin-bottom:16px">
        <div style="font-size:13px;font-weight:800;margin-bottom:4px">🏛 本会 <span style="color:var(--indigo)">計 ${sm.main.total}名</span></div>
        <div style="font-size:12px;color:var(--ink-mid)">${memPart} ・ ${guestPart} ・ 社員 <strong>${sm.main.employees}</strong> ・ その他 <strong>${sm.main.others}</strong></div>
        ${bars}
        <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
          <span style="font-size:13px;font-weight:800">🍻 懇親会 <span style="color:var(--gold-dark)">計 ${sm.social.total}名</span></span>
          <div style="font-size:12px;color:var(--ink-mid);margin-top:4px">会員 <strong>${sm.social.members}</strong> ・ ゲスト <strong>${sm.social.guests}</strong> ・ 社員 <strong>${sm.social.employees}</strong> ・ その他 <strong>${sm.social.others}</strong></div>
        </div>
      </div>`;
  }

  function render() {
    const editable = canEdit(me);
    const TABS = [
      { key:'overview', label:'概要' },
      { key:'attendance', label:'出欠' },
      { key:'roles', label:'役割' },
      { key:'files', label:'資料' },
    ];
    document.getElementById('content').innerHTML = `
      <div class="card ev-hero">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div>
            ${ev.eventType ? `<div style="margin-bottom:6px">${eventTypeBadge(ev.eventType)}</div>` : ''}
            <h1>${esc(ev.title)}</h1>
          </div>
          ${editable ? `<div style="display:flex;gap:6px;flex-shrink:0">
            <button class="btn btn-outline btn-sm" id="editEvBtn">編集</button>
            <button class="btn btn-danger btn-sm" id="delEvBtn">削除</button>
          </div>` : ''}
        </div>
        <div class="meta-row">🗓 ${fmtDateTime(ev.startAt)}${ev.endAt ? ' 〜 ' + fmtDateTime(ev.endAt).split(') ')[1] : ''}</div>
        ${ev.location ? `<div class="meta-row">📍 ${esc(ev.location)}</div>` : ''}
      </div>
      ${summaryPanelHtml(computeSummary())}
      <div class="ev-tabs">
        ${TABS.map(t => `<button class="ev-tab ${t.key===currentTab?'active':''}" data-tab="${t.key}">${t.label}</button>`).join('')}
      </div>
      <div id="tab-panel"></div>
    `;
    if (editable) {
      document.getElementById('editEvBtn').onclick = openEditModal;
      document.getElementById('delEvBtn').onclick = deleteEvent;
    }
    document.querySelectorAll('.ev-tab').forEach(b => b.onclick = () => { currentTab = b.dataset.tab; render(); });
    renderTabPanel(editable);
  }

  function renderTabPanel(editable) {
    const panel = document.getElementById('tab-panel');
    if (currentTab === 'overview') panel.innerHTML = overviewHtml();
    else if (currentTab === 'attendance') { panel.innerHTML = attendanceHtml(editable); bindAttendance(editable); }
    else if (currentTab === 'roles') { panel.innerHTML = rolesHtml(editable); bindRoles(editable); }
    else if (currentTab === 'files') { panel.innerHTML = filesHtml(editable); bindFiles(editable); }
  }

  // ── 概要タブ ──
  function overviewHtml() {
    return `<div class="card sec">
      <div class="meta-row" style="margin-bottom:8px">🗓 ${fmtDateTime(ev.startAt)}${ev.endAt ? ' 〜 ' + fmtDateTime(ev.endAt) : ''}</div>
      ${ev.location ? `<div class="meta-row" style="margin-bottom:8px">📍 ${esc(ev.location)}</div>` : ''}
      ${ev.description ? `<div class="desc">${esc(ev.description)}</div>` : '<div style="font-size:13px;color:var(--ink-light)">内容は未入力です</div>'}
    </div>`;
  }

  // 本会・懇親会それぞれの参加者を集計
  // 参加者をカテゴリ別に整理
  function participantRows() {
    const members = [], guests = [], emps = [], others = [];
    attendance.forEach(a => {
      const m = memberMap[a.uid];
      if (a.main === 'attending' || a.social === 'attending') {
        members.push({ name: m?.name || '不明', uid: a.uid, main: a.main==='attending', social: a.social==='attending', settled: !!a.settled, inviter: effectiveInviter(a.uid) });
      }
      (a.guests || []).forEach((g, gi) => { if (g.joinMain || g.joinSocial) guests.push({ key: a.uid+'_g'+gi, name: g.name||'', company: g.company||'', industry: g.industry||'', detail: g.detail||'', sites: g.sites||[], facebook: g.facebook||'', main: !!g.joinMain, social: !!g.joinSocial, settled: !!g.settled, by: m?.name || '' }); });
      (a.employees || []).forEach(e => { if (e.joinMain || e.joinSocial) emps.push({ name: e.name||'', main: !!e.joinMain, social: !!e.joinSocial, settled: !!e.settled, by: m?.name || '' }); });
    });
    (ev.others || []).forEach(o => { if (o.joinMain || o.joinSocial) others.push({ name: o.name||'', category: o.category||'', main: !!o.joinMain, social: !!o.joinSocial }); });
    return { members, guests, emps, others };
  }

  const yn = (b) => b ? '<span style="color:var(--green);font-weight:800">○</span>' : '<span style="color:var(--ink-light)">—</span>';

  function categoryTable(title, icon, rows, opts = {}) {
    const settledCount = rows.filter(r => r.settled).length;
    const showSettled = opts.settled !== false;
    const settledSummary = (showSettled && rows.length) ? `<span style="font-size:11px;color:var(--ink-mid)">決済済 ${settledCount} / 未 ${rows.length - settledCount}</span>` : '';
    if (!rows.length) {
      return `<div class="card sec"><div class="sec-title"><span class="ico">${icon}</span>${title}（0名）</div><div style="font-size:13px;color:var(--ink-light)">参加者はいません</div></div>`;
    }
    const head = `<tr><th>氏名</th><th>本会</th><th>懇親会</th>${showSettled?'<th>決済</th>':''}</tr>`;
    const body = rows.map((r, i) => {
      const nameCell = opts.kind==='member'
        ? `<a href="profile.html?uid=${r.uid}" style="font-weight:600">${esc(r.name)}</a>${r.inviter?`<div style="font-size:10px;color:var(--ink-light)">声かけ:${esc(r.inviter)}</div>`:''}${opts.editable?` <button class="btn-logout" style="padding:1px 6px;font-size:10px" data-inviter="${r.uid}">声かけ者</button>`:''}`
        : opts.kind==='guest'
          ? `<span class="g-toggle" data-gkey="${r.key}">${esc(r.name||'（無名）')} ▾</span>${r.company?`<div style="font-size:11px;color:var(--ink-mid)">${esc(r.company)}</div>`:''}`
          : opts.kind==='other'
            ? `<span style="font-weight:600">${esc(r.name)}</span> <span class="pill-guest">${esc(r.category||'その他')}</span>`
            : `<span style="font-weight:600">${esc(r.name)}</span>${r.by?`<span style="font-size:10px;color:var(--ink-light)">（${esc(r.by)}）</span>`:''}`;
      let html = `<tr><td>${nameCell}</td><td>${yn(r.main)}</td><td>${yn(r.social)}</td>${showSettled?`<td>${yn(r.settled)}</td>`:''}</tr>`;
      if (opts.kind==='guest') {
        const sites = (r.sites||[]).filter(Boolean).map(u=>`<a href="${escAttr(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join('<br>');
        const parts = [];
        if (r.industry) parts.push(`業種：${industryBadge(r.industry)}`);
        if (r.by) parts.push(`紹介：${esc(r.by)}`);
        if (r.detail) parts.push(`詳細：${esc(r.detail)}`);
        if (sites) parts.push(`会社サイト：<br>${sites}`);
        if (r.facebook) parts.push(`Facebook：<a href="${escAttr(r.facebook)}" target="_blank" rel="noopener">${esc(r.facebook)}</a>`);
        html += `<tr class="pdetail-row" id="gd-${r.key}" style="display:none"><td colspan="${showSettled?4:3}" class="pdetail">${parts.join('<br>') || '詳細情報なし'}</td></tr>`;
      }
      return html;
    }).join('');
    return `<div class="card sec">
      <div class="sec-head"><div class="sec-title"><span class="ico">${icon}</span>${title}（${rows.length}名）</div>${settledSummary}</div>
      <div style="overflow-x:auto"><table class="ptable"><thead>${head}</thead><tbody>${body}</tbody></table></div>
    </div>`;
  }

  function participationStatusHtml(editable) {
    const { members, guests, emps, others } = participantRows();
    return `
      <div style="display:flex;justify-content:flex-end;margin-bottom:10px">
        <button class="btn btn-outline btn-sm" id="csvBtn">📥 参加者CSV出力</button>
      </div>
      ${categoryTable('会員', '👤', members, { kind:'member', editable })}
      ${categoryTable('ゲスト', '🎟', guests, { kind:'guest' })}
      ${categoryTable('社員', '🏢', emps, { kind:'emp' })}
      ${categoryTable('その他', '🎤', others, { kind:'other', settled:false })}
    `;
  }

  function exportParticipantsCsv() {
    const { members, guests, emps, others } = participantRows();
    const rows = [['カテゴリ','氏名','社名/区分','業種','本会','懇親会','決済','紹介会員','会社サイト','Facebook','詳細']];
    const mk = (b) => b ? '○' : '';
    members.forEach(r => rows.push(['会員', r.name, '', '', mk(r.main), mk(r.social), mk(r.settled), r.inviter||'', '', '', '']));
    guests.forEach(r => rows.push(['ゲスト', r.name, r.company, r.industry, mk(r.main), mk(r.social), mk(r.settled), r.by||'', (r.sites||[]).join(' / '), r.facebook, r.detail]));
    emps.forEach(r => rows.push(['社員', r.name, '', '', mk(r.main), mk(r.social), mk(r.settled), r.by||'', '', '', '']));
    others.forEach(r => rows.push(['その他', r.name, r.category, '', mk(r.main), mk(r.social), '', '', '', '', '']));
    const csv = '﻿' + rows.map(r => r.map(c => /[",\r\n]/.test(c) ? '"'+String(c).replace(/"/g,'""')+'"' : c).join(',')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `参加者_${(ev.title||'イベント').replace(/[\\/:*?"<>|]/g,'')}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  async function saveMyParticipation() {
    const data = {
      main: document.querySelector('input[name="main"]:checked')?.value || null,
      social: document.querySelector('input[name="social"]:checked')?.value || null,
      settled: document.getElementById('my-settled').checked,
      guests: collectGuests(),
      employees: collectEmployees(),
      respondedAt: serverTimestamp(),
    };
    const btn = document.getElementById('saveAttBtn');
    btn.disabled = true; btn.textContent = '保存中...';
    try {
      await setDoc(doc(db, 'events', eventId, 'attendance', me.uid), data, { merge: true });
      const ex = attendance.find(a => a.uid === me.uid);
      if (ex) Object.assign(ex, data); else attendance.push({ uid: me.uid, ...data });
      await updateEventSummary();
      render();
      showToast('参加登録を保存しました');

  // ── イベント編集 ──
  const evEditModal = document.getElementById('evEditModal');
  function toLocalInput(ts){
    const d = ts?.toDate ? ts.toDate() : (ts ? new Date(ts) : null);
    if (!d) return '';
    const p = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function openEditModal() {
    document.getElementById('ee-title').value = ev.title || '';
    document.getElementById('ee-type').value = ev.eventType || '';
    document.getElementById('ee-start').value = toLocalInput(ev.startAt);
    document.getElementById('ee-end').value = toLocalInput(ev.endAt);
    document.getElementById('ee-location').value = ev.location || '';
    document.getElementById('ee-desc').value = ev.description || '';
    document.getElementById('ee-sheet').value = ev.roleSheetUrl || '';
    document.getElementById('ee-kportal').value = ev.kportalUrl || '';

  document.getElementById('eeSave').onclick = async () => {
    const title = document.getElementById('ee-title').value.trim();

    if (!title || !startStr) { showToast('タイトルと開始日時は必須です'); return; }
    const endStr = document.getElementById('ee-end').value;
    try {
      const upd = {
        title,
        eventType: document.getElementById('ee-type').value,
        startAt: new Date(startStr),
        endAt: endStr ? new Date(endStr) : null,
        location: document.getElementById('ee-location').value.trim(),
        description: document.getElementById('ee-desc').value.trim(),
        roleSheetUrl: document.getElementById('ee-sheet').value.trim(),
        kportalUrl: document.getElementById('ee-kportal').value.trim(),
        goalMainMembers: parseInt(document.getElementById('ee-goal-mem').value) || 0,
        goalMainGuests: parseInt(document.getElementById('ee-goal-guest').value) || 0,
        updatedAt: serverTimestamp(),
      };
      await updateDoc(doc(db, 'events', eventId), upd);
      Object.assign(ev, upd);
      evEditModal.classList.remove('open'); render();
      showToast('保存しました');
    } catch (e) { showToast('エラー：' + e.message); }
  };

  // ── 役割 ──
  const roleModal = document.getElementById('roleModal');
  function openRoleModal() {
    document.getElementById('role-name').value = '';
    document.getElementById('role-members').innerHTML = members
      .sort((a,b)=>(a.name||'').localeCompare(b.name||'','ja'))
      .map(m => `<label style="display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;cursor:pointer"><input type="checkbox" class="role-cb" value="${m.uid}" style="width:15px;height:15px">${esc(m.name)}</label>`).join('');
    roleModal.classList.add('open');
  }
  document.getElementById('roleCancel').onclick = () => roleModal.classList.remove('open');
  document.getElementById('roleSave').onclick = async () => {
    const roleName = document.getElementById('role-name').value.trim();
    if (!roleName) { showToast('役割名を入力してください'); return; }
    const userIds = [...document.querySelectorAll('.role-cb:checked')].map(c => c.value);
    const roles = [...(ev.roles || []), { roleName, userIds }];
    try {
      await updateDoc(doc(db, 'events', eventId), { roles });
      ev.roles = roles; roleModal.classList.remove('open'); render();
      showToast('役割を追加しました');
    } catch (e) { showToast('エラー：' + e.message); }
  };
  async function deleteRole(i) {
    if (!confirm('この役割を削除しますか？')) return;
    const roles = ev.roles.filter((_, idx) => idx !== i);
    try { await updateDoc(doc(db, 'events', eventId), { roles }); ev.roles = roles; render(); }
    catch (e) { showToast('エラー：' + e.message); }
  }

  // ── 声かけ者（イベント別上書き）──
  const inviterModal = document.getElementById('inviterModal');
  function openInviterModal(targetUid) {
    document.getElementById('inviter-target-uid').value = targetUid;
    const cur = attendance.find(a => a.uid === targetUid)?.inviterUid || '';
    const opts = ['<option value="">（プロフィールの声かけ者を使う）</option>']
      .concat(members.filter(m => m.uid !== targetUid).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ja'))
        .map(m => `<option value="${m.uid}">${esc(m.name)}</option>`));
    const sel = document.getElementById('inviter-select');
    sel.innerHTML = opts.join(''); sel.value = cur;
    inviterModal.classList.add('open');
  }
  document.getElementById('inviterCancel').onclick = () => inviterModal.classList.remove('open');
  document.getElementById('inviterSave').onclick = async () => {
    const targetUid = document.getElementById('inviter-target-uid').value;
    const inviterUid = document.getElementById('inviter-select').value || null;
    try {
      await setDoc(doc(db, 'events', eventId, 'attendance', targetUid), { inviterUid }, { merge: true });
      const a = attendance.find(x => x.uid === targetUid); if (a) a.inviterUid = inviterUid;
      inviterModal.classList.remove('open'); render();
      showToast('声かけ者を設定しました');
    } catch (e) { showToast('エラー：' + e.message); }
  };

  // ── 添付アップロード ──
  async function uploadAttach(e) {
    const files = [...e.target.files]; if (!files.length) return;
    const statusEl = document.getElementById('uploadStatus');
    const attachments = [...(ev.attachments || [])];
    try {
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        if (file.size > 15 * 1024 * 1024) { statusEl.textContent = `${file.name} は大きすぎます（15MBまで）`; continue; }
        statusEl.textContent = `アップロード中... (${i+1}/${files.length}) ${file.name}`;
        const ext = (file.name.split('.').pop() || 'dat').toLowerCase().replace(/[^a-z0-9]/g, '');
        const path = `events/${eventId}/${Date.now()}_${i}.${ext}`;
        const sref = ref(storage, path);
        await uploadBytes(sref, file, { contentType: file.type || 'application/octet-stream' });
        const url = await getDownloadURL(sref);
        attachments.push({ url, name: file.name, type: file.type, path });
      }
      await updateDoc(doc(db, 'events', eventId), { attachments });
      ev.attachments = attachments; statusEl.textContent = ''; render();
      showToast('添付しました');
    } catch (err) { console.error('attach upload error', err); statusEl.textContent = 'アップロード失敗：' + (err.code || err.message); }
  }
  async function deleteAttach(i) {
    if (!confirm('この添付を削除しますか？')) return;
    const target = ev.attachments[i];
    const attachments = ev.attachments.filter((_, idx) => idx !== i);
    try {
      await updateDoc(doc(db, 'events', eventId), { attachments });
      if (target.path) { try { await deleteObject(ref(storage, target.path)); } catch(_){} }
      ev.attachments = attachments; render(); showToast('削除しました');
    } catch (e) { showToast('エラー：' + e.message); }
  }

  // ── イベント削除 ──
  async function deleteEvent() {
    if (!confirm('このイベントを削除しますか？\n出欠・役割・添付もすべて削除されます。')) return;
    try {
      // 添付をStorageから削除
      for (const f of (ev.attachments || [])) { if (f.path) { try { await deleteObject(ref(storage, f.path)); } catch(_){} } }
      // 出欠サブコレクション削除
      const attSnap = await getDocs(collection(db, 'events', eventId, 'attendance'));
      await Promise.all(attSnap.docs.map(d => deleteDoc(d.ref)));
      await deleteDoc(doc(db, 'events', eventId));
      location.href = 'index.html';
    } catch (e) { showToast('削除に失敗しました：' + e.message); }
  }

  function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
</script>
</body>
</html>
