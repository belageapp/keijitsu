<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>会員｜経営実践研究会 広島会員 情報共有アプリ</title>
<link rel="stylesheet" href="style.css">
<style>
  .search-box{margin-bottom:16px}
  .search-box input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;outline:none}
  .search-box input:focus{border-color:var(--gold)}
  .member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .member-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:.15s;box-shadow:0 1px 3px var(--shadow)}
  .member-card:hover{border-color:var(--gold);transform:translateY(-2px)}
  .mc-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .mc-avatar{width:48px;height:48px;border-radius:50%;background:var(--indigo-light);color:var(--indigo);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;flex-shrink:0;overflow:hidden}
  .mc-avatar img{width:100%;height:100%;object-fit:cover}
  .mc-name{font-size:15px;font-weight:800;color:var(--ink)}
  .mc-company{font-size:12px;color:var(--ink-mid)}
  .mc-aspiration{font-size:12px;color:var(--ink-mid);line-height:1.6;border-top:1px solid var(--border);padding-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <div class="page-title"><span class="ico">👥</span>会員</div>
    <span class="badge badge-gray" id="count"></span>
  </div>
  <div class="search-box"><input id="search" placeholder="🔍 氏名・会社名・業種・事業内容・志で検索"></div>
  <div id="industry-filter" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px"></div>
  <div id="grid"><div class="loading">読み込み中...</div></div>
</div>

<script type="module">
  import { collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
  import { db } from './firebase-config.js';
  import { requireAuth, renderTopbar } from './auth.js';
  import { industryBadge } from './constants.js';

  let me = null, members = [];
  let kw = '', industryFilter = '';
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  // メンバーの会社配列を取得（旧 companyName 互換）
  function companiesOf(m) {
    if (Array.isArray(m.companies) && m.companies.length) return m.companies;
    if (m.companyName) return [{ name: m.companyName, industry: '', title: m.title || '' }];
    return [];
  }
  function industriesOf(m) {
    return [...new Set(companiesOf(m).map(c => c.industry).filter(Boolean))];
  }

  (async () => {
    me = await requireAuth();
    renderTopbar(me, 'members');
    await load();
  })();

  async function load() {
    try {
      const snap = await getDocs(collection(db, 'users'));
      members = snap.docs.map(d => ({ uid: d.id, ...d.data() }))
        .filter(m => !m.disabled)
        .sort((a,b) => (a.nameKana||a.name||'').localeCompare(b.nameKana||b.name||'', 'ja'));
      document.getElementById('count').textContent = `${members.length}名`;
      buildIndustryFilter();
      apply();
    } catch (e) {
      document.getElementById('grid').innerHTML = `<div class="empty" style="color:var(--red)">読み込みエラー：${e.message}</div>`;
    }
  }

  // 実際に使われている業種だけをバッジ絞り込みとして表示
  function buildIndustryFilter() {
    const used = [...new Set(members.flatMap(industriesOf))].sort((a,b)=>a.localeCompare(b,'ja'));
    const el = document.getElementById('industry-filter');
    const chip = (label, val, active) =>
      `<span class="ind-chip" data-ind="${esc(val)}" style="cursor:pointer;font-size:11px;font-weight:700;padding:4px 11px;border-radius:14px;border:1.5px solid ${active?'transparent':'var(--border)'};background:${active?'linear-gradient(135deg,#3BA3E6,#1C6BA8)':'#fff'};color:${active?'#fff':'var(--ink-mid)'}">${label}</span>`;
    el.innerHTML = chip('すべて', '', industryFilter==='') + used.map(i => chip(i, i, industryFilter===i)).join('');
    el.querySelectorAll('.ind-chip').forEach(c => c.onclick = () => {
      industryFilter = c.dataset.ind; buildIndustryFilter(); apply();
    });
  }

  function apply() {
    let list = members;
    if (industryFilter) list = list.filter(m => industriesOf(m).includes(industryFilter));
    if (kw) {
      list = list.filter(m => {
        const hay = [m.name, m.nameKana, m.businessContent, m.aspiration,
          ...companiesOf(m).flatMap(c => [c.name, c.industry, c.address])].filter(Boolean).join(' ').toLowerCase();
        return hay.includes(kw);
      });
    }
    render(list);
  }

  function render(list) {
    const el = document.getElementById('grid');
    if (!list.length) { el.innerHTML = '<div class="empty">該当する会員がいません</div>'; return; }
    el.innerHTML = `<div class="member-grid">${list.map(m => {
      const initial = (m.name || '?').charAt(0);
      const avatar = m.photoURL ? `<img src="${m.photoURL}" alt="">` : esc(initial);
      const comps = companiesOf(m);
      const inds = industriesOf(m);
      return `<div class="member-card" onclick="location.href='profile.html?uid=${m.uid}'">
        <div class="mc-head">
          <div class="mc-avatar">${avatar}</div>
          <div style="min-width:0">
            <div class="mc-name">${esc(m.name || '（未設定）')}</div>
            <div class="mc-company">${esc(comps[0]?.name || '')}${comps.length>1?` 他${comps.length-1}社`:''}</div>
          </div>
        </div>
        ${inds.length ? `<div style="display:flex;flex-wrap:wrap;gap:4px;margin:6px 0">${inds.map(i => `<span class="card-ind" data-ind="${esc(i)}" style="cursor:pointer">${industryBadge(i)}</span>`).join('')}</div>` : ''}
        ${m.aspiration ? `<div class="mc-aspiration">志：${esc(m.aspiration)}</div>` : ''}
      </div>`;
    }).join('')}</div>`;

    // カード上の業種バッジをクリックで絞り込み（カード遷移は止める）
    el.querySelectorAll('.card-ind').forEach(b => b.onclick = (e) => {
      e.stopPropagation();
      industryFilter = b.dataset.ind;
      buildIndustryFilter(); apply();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  document.getElementById('search').oninput = (e) => { kw = e.target.value.toLowerCase().trim(); apply(); };
</script>
</body>
</html>
