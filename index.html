<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>イベント一覧｜経営実践研究会 広島会員 情報共有アプリ</title>
<link rel="stylesheet" href="style.css">
<style>
  .cat-head{display:flex;flex-direction:column;gap:2px;padding:12px 16px;background:#F7FAFD;border-bottom:1px solid var(--border);border-top:1px solid var(--border)}
  .cat-head:first-child{border-top:none}
  .cat-head .t{font-size:14px;font-weight:800}
  .cat-head .s{font-size:11px;font-weight:600;color:var(--ink-mid)}
  .month-head{display:flex;align-items:baseline;gap:8px;padding:12px 16px 8px;background:linear-gradient(90deg,#EAF4FC,#F7FAFD);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  .month-head:first-child{border-top:none}
  .month-head .y{font-size:12px;font-weight:700;color:var(--ink-mid)}
  .month-head .m{font-size:20px;font-weight:900;color:var(--indigo);letter-spacing:.02em}
  .month-head .n{font-size:11px;font-weight:600;color:var(--ink-light);margin-left:auto}
  .view-seg{display:inline-flex;border:1.5px solid var(--border);border-radius:20px;overflow:hidden;margin-left:auto}
  .view-seg div{padding:6px 12px;font-size:12px;font-weight:700;color:var(--ink-mid);cursor:pointer;background:#fff}
  .view-seg div.active{background:var(--indigo);color:#fff}
  .month-strip{display:flex;align-items:center;gap:4px;margin-bottom:10px}
  .month-arrow{flex-shrink:0;width:30px;height:30px;border:1.5px solid var(--border);border-radius:50%;background:#fff;color:var(--ink-mid);font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px}
  .month-scroll{flex:1;display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:2px 0;-webkit-overflow-scrolling:touch}
  .month-scroll::-webkit-scrollbar{display:none}
  .month-chip{flex-shrink:0;scroll-snap-align:center;min-width:64px;padding:6px 10px;border:1.5px solid var(--border);border-radius:12px;background:#fff;text-align:center;cursor:pointer;color:var(--ink-mid);transition:.12s}
  .month-chip .y{display:block;font-size:9px;font-weight:700;color:var(--ink-light);line-height:1}
  .month-chip .m{display:block;font-size:15px;font-weight:900;line-height:1.3}
  .month-chip .c{display:block;font-size:9px;font-weight:700;color:var(--gold-dark);line-height:1}
  .month-chip.empty .m{color:var(--ink-light);font-weight:700}
  .month-chip.now{border-color:var(--gold)}
  .month-chip.active{background:var(--indigo);border-color:var(--indigo);color:#fff}
  .month-chip.active .y,.month-chip.active .c{color:rgba(255,255,255,.85)}
  .month-chip.active .m{color:#fff}
  .month-all{flex-shrink:0;padding:6px 10px;border:1.5px solid var(--border);border-radius:12px;background:#fff;font-size:11px;font-weight:700;color:var(--ink-mid);cursor:pointer;white-space:nowrap}
  .month-all.active{background:var(--indigo);border-color:var(--indigo);color:#fff}
  .sel{padding:6px 12px;border:1.5px solid var(--border);border-radius:20px;font-family:inherit;font-size:12px;font-weight:700;color:var(--ink-mid);background:#fff}
  .hq-link{display:block;margin-top:14px;text-align:center;font-size:12px;font-weight:700;color:var(--ink-mid);text-decoration:none}
  .hq-link:hover{color:var(--gold-dark)}
  .ev-apply{color:var(--indigo);text-decoration:underline;font-weight:700}
  .filter-tabs{display:flex;gap:6px;margin-bottom:16px}
  .filter-tab{padding:6px 14px;border:1.5px solid var(--border);border-radius:20px;background:#fff;font-size:12px;font-weight:700;color:var(--ink-mid);cursor:pointer}
  .filter-tab.active{background:var(--indigo);border-color:var(--indigo);color:#fff}
  .event-item{display:flex;gap:14px;padding:16px;border-bottom:1px solid var(--border);cursor:pointer;transition:.12s;align-items:flex-start}
  .event-item:last-child{border-bottom:none}
  .event-item:hover{background:#F4FAFE}
  .ev-date{flex-shrink:0;width:60px;text-align:center;border-right:2px solid var(--gold);padding-right:12px}
  .ev-date .m{font-size:14px;color:var(--gold-dark);font-weight:900;line-height:1.1}
  .ev-date .d{font-size:26px;font-weight:800;color:var(--ink);line-height:1.1}
  .ev-date .w{font-size:11px;color:var(--ink-light)}
  .ev-main{flex:1;min-width:0}
  .ev-title{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:4px}
  .ev-meta{font-size:12px;color:var(--ink-mid);display:flex;gap:12px;flex-wrap:wrap}
  .ev-meta span{display:inline-flex;align-items:center;gap:3px}
  .ev-past{opacity:.55}
</style>
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <div class="page-title"><span class="ico">📅</span>イベント一覧</div>
    <button class="btn btn-primary" id="addBtn" style="display:none">＋ イベント追加</button>
  </div>
  <div style="margin-bottom:12px"><input id="ev-search" placeholder="🔍 タイトル・種別・場所・内容で検索" style="width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;outline:none"></div>
  <div class="filter-tabs" style="align-items:center;margin-bottom:8px">
    <div class="filter-tab active" data-f="upcoming">開催予定</div>
    <div class="filter-tab" data-f="past">過去</div>
    <div class="filter-tab" data-f="all">すべて</div>
    <div class="view-seg" id="view-seg"><div class="active" data-v="time">時系列</div><div data-v="cat">分類別</div></div>
  </div>
  <div class="month-strip">
    <div class="month-arrow" id="month-prev">‹</div>
    <div class="month-scroll" id="month-scroll"></div>
    <div class="month-arrow" id="month-next">›</div>
    <div class="month-all" id="month-all">すべての月</div>
  </div>
  <div class="filter-tabs" style="align-items:center;flex-wrap:wrap">
    <select id="cat-filter" class="sel"></select>
    <select id="type-filter" class="sel"></select>
  </div>
  <div class="card" style="padding:0;overflow:hidden"><div id="list"><div class="loading">読み込み中...</div></div></div>
  <a class="hq-link" id="hq-link" href="#" target="_blank" rel="noopener">🏛 本部サイトのイベント一覧（全国）を見る ↗</a>
</div>

<!-- イベント追加/編集モーダル -->
<div class="modal-ov" id="evModal">
  <div class="modal">
    <div class="modal-title" id="evModalTitle">イベント追加</div>
    <input type="hidden" id="ev-id">
    <div class="field"><label>タイトル <span style="color:var(--red)">*</span></label><input id="ev-title" placeholder="例：7月例会"></div>
    <div class="field"><label>分類</label><select id="ev-category"></select><div class="hint">一覧では分類ごとに分けて表示されます。</div></div>
    <div class="field"><label>イベント種別</label><select id="ev-type"></select></div>
    <div class="field" style="display:flex;gap:10px">
      <div style="flex:1"><label>開始日時 <span style="color:var(--red)">*</span></label><input type="datetime-local" id="ev-start"></div>
      <div style="flex:1"><label>終了日時</label><input type="datetime-local" id="ev-end"></div>
    </div>
    <div class="field"><label>開催場所</label><input id="ev-location" placeholder="例：〇〇会館 3F"></div>
    <div class="field"><label>内容・概要</label><textarea id="ev-desc" placeholder="イベントの内容を入力"></textarea></div>
    <div class="field"><label>役割分担表（GoogleスプレッドシートURL）</label><input id="ev-sheet" placeholder="https://docs.google.com/spreadsheets/..."><div class="hint">「リンクを知っている全員が閲覧可」または「ウェブに公開」で詳細画面に埋め込み表示されます。特定のタブを表示したい場合は、そのタブを開いた状態のURL（末尾 #gid=…）を貼り付けてください。</div></div>
    <div class="field"><label>申込URL（調整さん・経実会申込サイトなど）</label><input id="ev-apply" placeholder="https://chouseisan.com/... または https://keijitsu.shikuminet.jp/events/..."><div class="hint" id="ev-apply-hint">一覧と詳細画面に「申込」ボタンとして表示されます。</div></div>
    <div class="field"><label>K-PORTAL 決済URL（本部決済サイト）</label><input id="ev-kportal" placeholder="https://..."><div class="hint">イベントごとの本部決済ページのURL。詳細画面に決済ボタンとして表示されます。</div></div>
    <div class="field" id="ev-goal-wrap" style="display:none;gap:10px">
      <div style="flex:1"><label>本会 会員目標（人）</label><input type="number" id="ev-goal-mem" min="0" placeholder="例：40"></div>
      <div style="flex:1"><label>本会 ゲスト目標（人）</label><input type="number" id="ev-goal-guest" min="0" placeholder="例：10"></div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-outline" id="evCancel">キャンセル</button>
      <button class="btn btn-primary" id="evSave">保存する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { collection, getDocs, addDoc, updateDoc, doc, serverTimestamp, query, orderBy }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
  import { db } from './firebase-config.js';
  import { optionalAuth, renderTopbar, canEdit } from './auth.js?v=1.6.0';
  import { EVENT_TYPES, eventTypeBadge, MOBILIZATION_TYPES, eventTypeOptionsInner, EVENT_CATEGORIES, eventCategory, eventCategoryBadge, eventCategoryOptionsInner, HQ_EVENTS_URL, applySiteName, FEATURES } from './constants.js?v=1.6.0';

  let me = null;
  let allEvents = [];
  let filter = 'upcoming';
  let typeFilter = '';
  let catFilter = '';
  let monthFilter = '';
  let view = 'time';
  let evKw = '';

  // 種別セレクトを構築（モーダル用・絞り込み用）
  document.getElementById('ev-type').innerHTML =
    '<option value="">（未設定）</option>' + eventTypeOptionsInner();
  document.getElementById('type-filter').innerHTML =
    '<option value="">すべての種別</option>' + eventTypeOptionsInner();
  document.getElementById('type-filter').onchange = (e) => { typeFilter = e.target.value; render(); };
  document.getElementById('ev-category').innerHTML =
    '<option value="">（未設定）</option>' + eventCategoryOptionsInner();
  document.getElementById('cat-filter').innerHTML =
    '<option value="">すべての分類</option>' + EVENT_CATEGORIES.map(c => `<option value="${c.key}">${c.label}</option>`).join('');
  document.getElementById('cat-filter').onchange = (e) => { catFilter = e.target.value; render(); };
  document.querySelectorAll('#view-seg div').forEach(b => b.onclick = () => {
    document.querySelectorAll('#view-seg div').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); view = b.dataset.v; render();
  });
  const monthKey = d => d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}` : '';
  // 月の帯：今月を中心に前後の月を横に並べる（イベントのある月は件数つき）
  const addMonths = (k, n) => { const y = +k.slice(0,4), m = +k.slice(5) - 1 + n; const d = new Date(y, m, 1); return monthKey(d); };
  let monthInit = false;
  function buildMonthStrip() {
    const nowKey = monthKey(new Date());
    const counts = {};
    allEvents.forEach(ev => { const k = monthKey(fmtDate(ev.startAt)); if (k) counts[k] = (counts[k] || 0) + 1; });
    const evKeys = Object.keys(counts).sort();
    let first = addMonths(nowKey, -6), last = addMonths(nowKey, 6);
    if (evKeys.length) { if (evKeys[0] < first) first = evKeys[0]; if (evKeys[evKeys.length-1] > last) last = evKeys[evKeys.length-1]; }
    const keys = []; for (let k = first; k <= last; k = addMonths(k, 1)) keys.push(k);
    // 既定：月は選ばない（当月以降の全日程を表示）。帯は今月を中心に出す
    if (!monthInit) { monthInit = true; monthFilter = ''; }
    const sc = document.getElementById('month-scroll');
    sc.innerHTML = keys.map(k => {
      const showYear = k.endsWith('-01') || k === keys[0];
      return `<div class="month-chip ${counts[k] ? '' : 'empty'} ${k === nowKey ? 'now' : ''} ${k === monthFilter ? 'active' : ''}" data-k="${k}">
        <span class="y">${showYear ? k.slice(0,4) : '&nbsp;'}</span><span class="m">${parseInt(k.slice(5),10)}月</span><span class="c">${counts[k] ? counts[k] + '件' : '&nbsp;'}</span>
      </div>`;
    }).join('');
    document.getElementById('month-all').classList.toggle('active', !monthFilter);
    sc.querySelectorAll('.month-chip').forEach(c => c.onclick = () => {
      monthFilter = (monthFilter === c.dataset.k) ? '' : c.dataset.k;
      buildMonthStrip(); render(); centerMonth(monthFilter || nowKey);
    });
    document.getElementById('month-all').onclick = () => { monthFilter = ''; buildMonthStrip(); render(); };
  }
  function centerMonth(k) {
    const el = document.querySelector(`.month-chip[data-k="${k}"]`);
    if (el) el.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  }
  document.getElementById('month-prev').onclick = () => document.getElementById('month-scroll').scrollBy({ left: -210, behavior: 'smooth' });
  document.getElementById('month-next').onclick = () => document.getElementById('month-scroll').scrollBy({ left: 210, behavior: 'smooth' });
  document.getElementById('hq-link').href = HQ_EVENTS_URL;
  if (!FEATURES.apply) document.getElementById('ev-apply-hint').textContent = '（現在、申込ボタンは一時的に非表示にしています。URLは保存されます）';
  document.getElementById('ev-search').oninput = (e) => { evKw = e.target.value.toLowerCase().trim(); render(); };

  const WD = ['日','月','火','水','木','金','土'];
  function fmtDate(ts) {
    const d = ts?.toDate ? ts.toDate() : (ts ? new Date(ts) : null);
    return d;
  }
  function toLocalInput(d) {
    if (!d) return '';
    const p = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  (async () => {
    me = await optionalAuth();   // ログインなしでも閲覧可
    renderTopbar(me, 'events');
    if (canEdit(me)) document.getElementById('addBtn').style.display = 'inline-block';
    await loadEvents();
  })();

  async function loadEvents() {
    const el = document.getElementById('list');
    try {
      const snap = await getDocs(query(collection(db, 'events'), orderBy('startAt', 'asc')));
      allEvents = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      buildMonthStrip();
      render();
      // 今月を真ん中に
      requestAnimationFrame(() => centerMonth(monthFilter || monthKey(new Date())));
    } catch (e) {
      el.innerHTML = `<div class="empty" style="color:var(--red)">読み込みエラー：${e.message}</div>`;
    }
  }

  function render() {
    const el = document.getElementById('list');
    const now = new Date();
    let rows = allEvents.map(ev => ({ ...ev, _d: fmtDate(ev.startAt) }));
    if (monthFilter) rows = rows.filter(r => monthKey(r._d) === monthFilter);
    if (catFilter) rows = rows.filter(r => (r.category || '') === catFilter);
    if (typeFilter) rows = rows.filter(r => r.eventType === typeFilter);
    if (evKw) rows = rows.filter(r => [r.title, r.eventType, r.location, r.description].filter(Boolean).join(' ').toLowerCase().includes(evKw));
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);   // 「開催予定」＝当月1日以降
    if (filter === 'upcoming') rows = rows.filter(r => r._d && r._d >= monthStart).sort((a,b)=>a._d-b._d);
    else if (filter === 'past') rows = rows.filter(r => !r._d || r._d < monthStart).sort((a,b)=>b._d-a._d);
    else rows.sort((a,b)=> (a._d||0)-(b._d||0));   // すべて：古い順（時系列）

    if (!rows.length) { el.innerHTML = '<div class="empty">該当するイベントはありません</div>'; return; }

    if (view === 'cat') {
      // 分類別：①→②→未分類の順。並びは各分類の中で日付順
      const groups = [...EVENT_CATEGORIES.map(c => ({ ...c, rows: rows.filter(r => r.category === c.key) })),
                      { key:'', label:'その他のイベント', sub:'分類が未設定のイベント', rows: rows.filter(r => !eventCategory(r.category)) }]
                     .filter(g => g.rows.length);
      el.innerHTML = groups.map(g => `
        <div class="cat-head" style="${g.color ? `color:${g.color};background:${g.bg}66` : ''}"><span class="t">${g.label}</span><span class="s">${g.sub}</span></div>
        ${g.rows.map(itemHtml).join('')}`).join('');
      return;
    }
    // 時系列（既定）：月ごとに見出しを入れて日付順
    const months = [];
    rows.forEach(r => {
      const k = monthKey(r._d) || 'none';
      let g = months.find(m => m.key === k);
      if (!g) { g = { key: k, rows: [] }; months.push(g); }
      g.rows.push(r);
    });
    el.innerHTML = months.map(g => `
      <div class="month-head">${g.key === 'none' ? '<span class="m">日時未定</span>' : `<span class="y">${g.key.slice(0,4)}年</span><span class="m">${parseInt(g.key.slice(5),10)}月</span>`}<span class="n">${g.rows.length}件</span></div>
      ${g.rows.map(itemHtml).join('')}`).join('');
  }

  function itemHtml(ev) {
    const now = new Date();
      const d = ev._d;
      const past = d && d < now;
      const dateBox = d ? `
        <div class="ev-date">
          <div class="m">${d.getMonth()+1}月</div>
          <div class="d">${d.getDate()}</div>
          <div class="w">(${WD[d.getDay()]})</div>
        </div>` : `<div class="ev-date"><div class="w">日時未定</div></div>`;
      const time = d ? `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` : '';
      return `<div class="event-item ${past?'ev-past':''}" onclick="location.href='event.html?id=${ev.id}'">
        ${dateBox}
        <div class="ev-main">
          <div style="margin-bottom:3px;display:flex;gap:6px;flex-wrap:wrap">${eventCategoryBadge(ev.category)}${eventTypeBadge(ev.eventType)}</div>
          <div class="ev-title">${esc(ev.title)}</div>
          <div class="ev-meta">
            ${time ? `<span>🕐 ${time}</span>` : ''}
            ${ev.location ? `<span>📍 ${esc(ev.location)}</span>` : ''}
            ${past ? '<span class="badge badge-gray">終了</span>' : '<span class="badge badge-gold">予定</span>'}
            ${FEATURES.apply && ev.applyUrl && !past ? `<span>📝 <a class="ev-apply" href="${escAttr(ev.applyUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">申込（${applySiteName(ev.applyUrl)}）↗</a></span>` : ''}
          </div>
          ${FEATURES.attendance ? summaryLineHtml(ev) : ''}
        </div>
      </div>`;
  }

  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function escAttr(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

  function miniBar(label, actual, goal){
    const pct = goal>0 ? Math.round(actual/goal*100) : 0;
    const barPct = Math.min(100, pct);
    const reached = goal>0 && actual>=goal;
    const rem = Math.max(0, goal-actual);
    return `<div style="max-width:300px;margin-top:5px">
      <div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:2px">
        <span style="color:var(--ink-mid)">${label} ${actual}/${goal}</span>
        <span style="font-weight:800;color:${reached?'var(--green)':'var(--gold-dark)'}">${reached?'🎉達成':(!reached?'あと'+rem:'')+' '+pct+'%'}</span>
      </div>
      <div style="height:6px;background:#E4EDF5;border-radius:3px;overflow:hidden">
        <div style="height:100%;width:${barPct}%;background:${reached?'var(--green)':'linear-gradient(90deg,#5BC0F0,#1C6BA8)'};border-radius:3px"></div>
      </div>
    </div>`;
  }
  function summaryLineHtml(ev){
    const isMob = MOBILIZATION_TYPES.includes(ev.eventType);
    const sm = ev.summary;
    const goalMem = ev.goalMainMembers||0, goalGuest = ev.goalMainGuests||0;
    const mem = sm?.main?.members||0, guest = sm?.main?.guests||0;
    return `<div style="margin-top:8px">
      <div style="display:flex;gap:12px;font-size:11px;color:var(--ink-mid);margin-bottom:4px;flex-wrap:wrap">
        <span>🏛 本会 <strong style="color:var(--indigo)">${sm?.main?.total||0}</strong>名（会員${mem}・ゲスト${guest}）</span>
        <span>🍻 懇親会 <strong style="color:var(--gold-dark)">${sm?.social?.total||0}</strong>名</span>
      </div>
      ${isMob && goalMem ? miniBar('👤 会員', mem, goalMem) : ''}
      ${isMob && goalGuest ? miniBar('🎟 ゲスト', guest, goalGuest) : ''}
    </div>`;
  }

  // フィルタタブ
  document.querySelectorAll('.filter-tab').forEach(t => t.onclick = () => {
    document.querySelectorAll('.filter-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active'); filter = t.dataset.f; render();
  });

  // ── 追加・編集モーダル ──
  const modal = document.getElementById('evModal');
  function openModal(ev) {
    document.getElementById('evModalTitle').textContent = ev ? 'イベント編集' : 'イベント追加';
    document.getElementById('ev-id').value = ev?.id || '';
    document.getElementById('ev-title').value = ev?.title || '';
    document.getElementById('ev-category').value = ev?.category || '';
    document.getElementById('ev-type').value = ev?.eventType || '';
    document.getElementById('ev-start').value = ev?.startAt ? toLocalInput(fmtDate(ev.startAt)) : '';
    document.getElementById('ev-end').value = ev?.endAt ? toLocalInput(fmtDate(ev.endAt)) : '';
    document.getElementById('ev-location').value = ev?.location || '';
    document.getElementById('ev-desc').value = ev?.description || '';
    document.getElementById('ev-sheet').value = ev?.roleSheetUrl || '';
    document.getElementById('ev-apply').value = ev?.applyUrl || '';
    document.getElementById('ev-kportal').value = ev?.kportalUrl || '';
    document.getElementById('ev-goal-mem').value = ev?.goalMainMembers ?? '';
    document.getElementById('ev-goal-guest').value = ev?.goalMainGuests ?? '';
    toggleEvGoal();
    modal.classList.add('open');
  }
  function toggleEvGoal() {
    const on = MOBILIZATION_TYPES.includes(document.getElementById('ev-type').value);
    document.getElementById('ev-goal-wrap').style.display = on ? 'flex' : 'none';
  }
  document.getElementById('ev-type').onchange = toggleEvGoal;
  document.getElementById('addBtn').onclick = () => openModal(null);
  document.getElementById('evCancel').onclick = () => modal.classList.remove('open');

  document.getElementById('evSave').onclick = async () => {
    const id = document.getElementById('ev-id').value;
    const title = document.getElementById('ev-title').value.trim();
    const startStr = document.getElementById('ev-start').value;
    if (!title || !startStr) { showToast('タイトルと開始日時は必須です'); return; }
    const endStr = document.getElementById('ev-end').value;
    const data = {
      title,
      category: document.getElementById('ev-category').value,
      eventType: document.getElementById('ev-type').value,
      startAt: new Date(startStr),
      endAt: endStr ? new Date(endStr) : null,
      location: document.getElementById('ev-location').value.trim(),
      description: document.getElementById('ev-desc').value.trim(),
      roleSheetUrl: document.getElementById('ev-sheet').value.trim(),
      applyUrl: document.getElementById('ev-apply').value.trim(),
      kportalUrl: document.getElementById('ev-kportal').value.trim(),
      goalMainMembers: parseInt(document.getElementById('ev-goal-mem').value) || 0,
      goalMainGuests: parseInt(document.getElementById('ev-goal-guest').value) || 0,
      updatedAt: serverTimestamp(),
    };
    const btn = document.getElementById('evSave');
    btn.disabled = true; btn.textContent = '保存中...';
    try {
      if (id) {
        await updateDoc(doc(db, 'events', id), data);
      } else {
        await addDoc(collection(db, 'events'), { ...data, createdBy: me.uid, createdAt: serverTimestamp() });
      }
      modal.classList.remove('open');
      await loadEvents();
      showToast('保存しました');
    } catch (e) {
      showToast('保存に失敗しました：' + e.message);
    }
    btn.disabled = false; btn.textContent = '保存する';
  };

  function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
</script>
</body>
</html>
