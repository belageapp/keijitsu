<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>プロフィール｜経営実践研究会 広島会員 情報共有アプリ</title>
<link rel="stylesheet" href="style.css">
<style>
  .prof-head{padding:24px;margin-bottom:16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .prof-avatar{width:80px;height:80px;border-radius:50%;background:var(--indigo-light);color:var(--indigo);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;flex-shrink:0;overflow:hidden;position:relative}
  .prof-avatar img{width:100%;height:100%;object-fit:cover}
  .prof-name{font-size:22px;font-weight:800;color:var(--ink)}
  .prof-company{font-size:14px;color:var(--ink-mid);margin-top:2px}
  .prof-title{font-size:12px;color:var(--ink-light)}
  .sec{padding:20px;margin-bottom:16px}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .sec-title{font-size:14px;font-weight:800;color:var(--ink)}
  .sec-title .ico{color:var(--gold);margin-right:5px}
  .info-row{display:flex;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
  .info-row:last-child{border-bottom:none}
  .info-label{width:100px;flex-shrink:0;color:var(--ink-mid);font-weight:700;font-size:13px}
  .info-val{flex:1;color:var(--ink);white-space:pre-wrap;line-height:1.8}
  .info-val.empty-val{color:var(--ink-light)}
  .prose{font-size:14px;line-height:1.9;white-space:pre-wrap;color:var(--ink)}
  .prose.empty-val{color:var(--ink-light)}
  /* 会社カード（表示） */
  .company-card{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;background:#FBFDFF}
  .company-card:last-child{margin-bottom:0}
  .cc-name{font-size:15px;font-weight:800;color:var(--ink)}
  .cc-role{font-size:12px;color:var(--ink-mid)}
  .cc-detail{font-size:12px;color:var(--ink-mid);margin-top:6px;line-height:1.8}
  .cc-detail a{color:var(--gold-dark);font-weight:600;word-break:break-all}
  /* 会社カード（編集） */
  .company-edit{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;background:#FBFDFF}
  .company-edit .ce-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .company-edit .ce-head-label{font-size:12px;font-weight:700;color:var(--ink-mid)}
  .company-edit .ce-row{display:flex;gap:8px;margin-bottom:8px}
  .company-edit .ce-row:last-child{margin-bottom:0}
  .company-edit input,.company-edit select{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;background:#fff}
  .ce-del{background:#fff;border:1.5px solid #E4C4C0;color:var(--red);font-size:11px;font-weight:700;cursor:pointer;padding:3px 10px;border-radius:7px}
</style>
</head>
<body>
<div class="wrap">
  <a href="members.html" class="nav-link" style="display:inline-block;margin-bottom:12px">← メンバー一覧に戻る</a>
  <div id="content"><div class="loading">読み込み中...</div></div>
</div>

<!-- 基本情報編集モーダル -->
<div class="modal-ov" id="editModal">
  <div class="modal">
    <div class="modal-title">プロフィール編集</div>
    <div class="field"><label>お名前（漢字） <span style="color:var(--red)">*</span></label>
      <div style="display:flex;gap:8px">
        <input id="e-sei" placeholder="姓（山田）">
        <input id="e-mei" placeholder="名（太郎）">
      </div>
    </div>
    <div class="field"><label>ふりがな <span style="color:var(--red)">*</span></label>
      <div style="display:flex;gap:8px">
        <input id="e-sei-kana" placeholder="せい（やまだ）">
        <input id="e-mei-kana" placeholder="めい（たろう）">
      </div>
    </div>
    <div class="field"><label>会社・組織（複数登録できます）</label>
      <div id="companies-edit"></div>
      <button type="button" class="btn btn-outline btn-sm" id="addCompanyBtn" style="margin-top:6px">＋ 会社・組織を追加</button>
    </div>
    <div class="field"><label>志</label><textarea id="e-aspiration" placeholder="あなたの志を記入"></textarea></div>
    <div class="field"><label>事業内容</label><textarea id="e-business" placeholder="事業内容を記入"></textarea></div>
    <div class="modal-btns">
      <button class="btn btn-outline" id="editCancel">キャンセル</button>
      <button class="btn btn-primary" id="editSave">保存する</button>
    </div>
  </div>
</div>

<!-- 紹介者・声かけ者編集モーダル -->
<div class="modal-ov" id="relModal">
  <div class="modal">
    <div class="modal-title" id="relTitle">設定</div>
    <input type="hidden" id="rel-field">
    <div class="field"><label id="rel-label"></label>
      <select id="rel-select"></select>
    </div>
    <div class="modal-btns">
      <button class="btn btn-outline" id="relCancel">キャンセル</button>
      <button class="btn btn-primary" id="relSave">保存する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { doc, getDoc, updateDoc, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
  import { ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js';
  import { db, storage } from './firebase-config.js';
  import { requireAuth, renderTopbar, canEdit, canEditProfile } from './auth.js';
  import { INDUSTRIES, industryBadge } from './constants.js';

  const targetUid = new URLSearchParams(location.search).get('uid');
  let me = null, user = null, members = [], memberMap = {};
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function escAttr(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

  // 既存データを companies 配列に正規化（旧 companyName/title → companies[0]）
  function getCompanies(u) {
    if (Array.isArray(u.companies) && u.companies.length) return u.companies;
    if (u.companyName) return [{ name: u.companyName, title: u.title || '', industry: '', address: '', phone: '', url: '' }];
    return [];
  }

  const industryOptions = (sel) => '<option value="">業種を選択</option>' +
    INDUSTRIES.map(i => `<option value="${i}"${i===sel?' selected':''}>${i}</option>`).join('');

  (async () => {
    me = await requireAuth();
    renderTopbar(me, null);
    if (!targetUid) { location.href = 'members.html'; return; }
    await load();
  })();

  async function load() {
    try {
      const [uSnap, memSnap] = await Promise.all([
        getDoc(doc(db, 'users', targetUid)),
        getDocs(collection(db, 'users')),
      ]);
      if (!uSnap.exists()) { document.getElementById('content').innerHTML = '<div class="empty">メンバーが見つかりません</div>'; return; }
      user = { uid: uSnap.id, ...uSnap.data() };
      members = memSnap.docs.map(d => ({ uid: d.id, ...d.data() })).filter(m => !m.disabled);
      memberMap = {}; members.forEach(m => memberMap[m.uid] = m);
      render();
    } catch (e) {
      document.getElementById('content').innerHTML = `<div class="empty" style="color:var(--red)">読み込みエラー：${e.message}</div>`;
    }
  }

  function render() {
    const editableSelf = canEditProfile(me, targetUid); // 本人 or admin
    const editableRel  = canEdit(me);                    // editor 以上（声かけ者）
    const initial = (user.name || '?').charAt(0);
    const avatar = user.photoURL ? `<img src="${user.photoURL}" alt="">` : esc(initial);
    const introducer = user.introducerUid ? memberMap[user.introducerUid]?.name : null;
    const inviter    = user.inviterUid ? memberMap[user.inviterUid]?.name : null;
    const companies = getCompanies(user);
    const primary = companies[0];

    document.getElementById('content').innerHTML = `
      <div class="card prof-head">
        <div class="prof-avatar">${avatar}
          ${editableSelf ? '<label style="position:absolute;bottom:0;right:0;background:var(--gold);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px">📷<input type="file" id="photoInput" accept="image/*" style="display:none"></label>' : ''}
        </div>
        <div style="flex:1;min-width:0">
          ${user.nameKana ? `<div style="font-size:11px;color:var(--ink-light)">${esc(user.nameKana)}</div>` : ''}
          <div class="prof-name">${esc(user.name || '（未設定）')}</div>
          <div class="prof-company">${esc(primary?.name || '')}</div>
          <div class="prof-title">${esc(primary?.title || '')}</div>
        </div>
        ${editableSelf ? '<button class="btn btn-outline btn-sm" id="editBtn">基本情報を編集</button>' : ''}
      </div>

      <div class="card sec">
        <div class="sec-head"><div class="sec-title"><span class="ico">🏢</span>会社・組織</div></div>
        ${companies.length ? companies.map(c => `
          <div class="company-card">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap">
              <div><span class="cc-name">${esc(c.name)}</span> ${c.title ? `<span class="cc-role">${esc(c.title)}</span>` : ''}</div>
              ${industryBadge(c.industry)}
            </div>
            <div class="cc-detail">
              ${c.address ? `📍 ${esc(c.address)}<br>` : ''}
              ${c.phone ? `☎ <a href="tel:${escAttr(c.phone)}">${esc(c.phone)}</a>　` : ''}
              ${c.url ? `🌐 <a href="${escAttr(c.url)}" target="_blank" rel="noopener">${esc(c.url)}</a>` : ''}
            </div>
          </div>`).join('') : '<div class="prose empty-val">未登録</div>'}
      </div>

      <div class="card sec">
        <div class="sec-title"><span class="ico">🔥</span>志</div>
        <div class="prose ${user.aspiration?'':'empty-val'}">${user.aspiration ? esc(user.aspiration) : '未登録'}</div>
      </div>

      <div class="card sec">
        <div class="sec-title"><span class="ico">🏢</span>事業内容</div>
        <div class="prose ${user.businessContent?'':'empty-val'}">${user.businessContent ? esc(user.businessContent) : '未登録'}</div>
      </div>

      <div class="card sec">
        <div class="sec-title"><span class="ico">🤝</span>ご縁</div>
        <div class="info-row">
          <div class="info-label">紹介者</div>
          <div class="info-val ${introducer?'':'empty-val'}">${introducer ? esc(introducer) : '未設定'}</div>
          ${editableSelf ? '<button class="btn btn-outline btn-sm" id="editIntroducer">変更</button>' : ''}
        </div>
        <div class="info-row">
          <div class="info-label">声かけ者</div>
          <div class="info-val ${inviter?'':'empty-val'}">${inviter ? esc(inviter) : '未設定'}</div>
          ${editableRel ? '<button class="btn btn-outline btn-sm" id="editInviter">変更</button>' : ''}
        </div>
        ${editableRel ? '' : '<div class="hint" style="font-size:11px;color:var(--ink-light);margin-top:6px">※ 声かけ者は編集権限を持つ方のみ設定できます</div>'}
      </div>
    `;

    if (editableSelf) {
      document.getElementById('editBtn').onclick = openEditModal;
      document.getElementById('editIntroducer').onclick = () => openRelModal('introducerUid', '紹介者', true);
      const pi = document.getElementById('photoInput');
      if (pi) pi.onchange = uploadPhoto;
    }
    if (editableRel) {
      document.getElementById('editInviter').onclick = () => openRelModal('inviterUid', '声かけ者', false);
    }
  }

  // ── 会社・組織リポーター ──
  function companyEditorHtml(c = {}) {
    return `<div class="company-edit">
      <div class="ce-head">
        <span class="ce-head-label">🏢 会社・組織</span>
        <button type="button" class="ce-del" title="この会社を削除">✕ 削除</button>
      </div>
      <div class="ce-row"><input class="ce-name" placeholder="会社・組織名" value="${escAttr(c.name)}"></div>
      <div class="ce-row">
        <input class="ce-title" placeholder="役職（例：代表取締役）" value="${escAttr(c.title)}">
        <select class="ce-industry">${industryOptions(c.industry)}</select>
      </div>
      <div class="ce-row"><input class="ce-address" placeholder="住所" value="${escAttr(c.address)}"></div>
      <div class="ce-row">
        <input class="ce-phone" placeholder="電話番号" value="${escAttr(c.phone)}">
        <input class="ce-url" placeholder="URL（https://…）" value="${escAttr(c.url)}">
      </div>
    </div>`;
  }
  function bindCompanyDeletes() {
    document.querySelectorAll('#companies-edit .ce-del').forEach(b => b.onclick = (e) => {
      e.target.closest('.company-edit').remove();
    });
  }
  function addCompanyEditor(c) {
    document.getElementById('companies-edit').insertAdjacentHTML('beforeend', companyEditorHtml(c));
    bindCompanyDeletes();
  }
  function collectCompanies() {
    return [...document.querySelectorAll('#companies-edit .company-edit')].map(el => ({
      name:     el.querySelector('.ce-name').value.trim(),
      title:    el.querySelector('.ce-title').value.trim(),
      industry: el.querySelector('.ce-industry').value,
      address:  el.querySelector('.ce-address').value.trim(),
      phone:    el.querySelector('.ce-phone').value.trim(),
      url:      el.querySelector('.ce-url').value.trim(),
    })).filter(c => c.name);  // 名称が空の行は除外
  }
  document.getElementById('addCompanyBtn').onclick = () => addCompanyEditor({});

  // ── 基本情報編集 ──
  const editModal = document.getElementById('editModal');
  function openEditModal() {
    const nameParts = (user.name || '').split(/[\s　]+/);
    const kanaParts = (user.nameKana || '').split(/[\s　]+/);
    document.getElementById('e-sei').value = user.sei || nameParts[0] || '';
    document.getElementById('e-mei').value = user.mei || nameParts[1] || '';
    document.getElementById('e-sei-kana').value = user.seiKana || kanaParts[0] || '';
    document.getElementById('e-mei-kana').value = user.meiKana || kanaParts[1] || '';
    // 会社エディタを構築（既存を並べる。1件も無ければ空1件）
    const companies = getCompanies(user);
    document.getElementById('companies-edit').innerHTML = '';
    (companies.length ? companies : [{}]).forEach(c => addCompanyEditor(c));
    document.getElementById('e-aspiration').value = user.aspiration || '';
    document.getElementById('e-business').value = user.businessContent || '';
    editModal.classList.add('open');
  }
  document.getElementById('editCancel').onclick = () => editModal.classList.remove('open');
  document.getElementById('editSave').onclick = async () => {
    const sei = document.getElementById('e-sei').value.trim();
    const mei = document.getElementById('e-mei').value.trim();
    const seiKana = document.getElementById('e-sei-kana').value.trim();
    const meiKana = document.getElementById('e-mei-kana').value.trim();
    if (!sei || !mei || !seiKana || !meiKana) { showToast('お名前とふりがなは必須です'); return; }
    try {
      const companies = collectCompanies();
      const upd = {
        sei, mei, seiKana, meiKana,
        name: `${sei} ${mei}`,
        nameKana: `${seiKana} ${meiKana}`,
        companies,
        // 検索・一覧の後方互換：1社目を従来フィールドにも保持
        companyName: companies[0]?.name || '',
        title: companies[0]?.title || '',
        industries: companies.map(c => c.industry).filter(Boolean),  // 検索用
        aspiration: document.getElementById('e-aspiration').value.trim(),
        businessContent: document.getElementById('e-business').value.trim(),
      };
      await updateDoc(doc(db, 'users', targetUid), upd);
      Object.assign(user, upd);
      editModal.classList.remove('open'); render();
      showToast('保存しました');
    } catch (e) { showToast('エラー：' + e.message); }
  };

  // ── 紹介者・声かけ者 ──
  const relModal = document.getElementById('relModal');
  function openRelModal(field, label) {
    document.getElementById('rel-field').value = field;
    document.getElementById('relTitle').textContent = label + 'の設定';
    document.getElementById('rel-label').textContent = label + 'をメンバーから選択';
    const cur = user[field] || '';
    const opts = ['<option value="">（未設定）</option>'].concat(
      members.filter(m => m.uid !== targetUid).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ja'))
        .map(m => `<option value="${m.uid}">${esc(m.name)}${m.companyName?'（'+esc(m.companyName)+'）':''}</option>`));
    const sel = document.getElementById('rel-select');
    sel.innerHTML = opts.join(''); sel.value = cur;
    relModal.classList.add('open');
  }
  document.getElementById('relCancel').onclick = () => relModal.classList.remove('open');
  document.getElementById('relSave').onclick = async () => {
    const field = document.getElementById('rel-field').value;
    const val = document.getElementById('rel-select').value || null;
    try {
      await updateDoc(doc(db, 'users', targetUid), { [field]: val });
      user[field] = val;
      relModal.classList.remove('open'); render();
      showToast('保存しました');
    } catch (e) { showToast('エラー：' + e.message); }
  };

  // ── 顔写真アップロード ──
  // 画像をブラウザ内で縮小（最大辺600px・JPEG）してからアップロード
  function resizeImage(file, maxDim = 600, quality = 0.85) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        let { width, height } = img;
        if (width >= height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob(b => b ? resolve(b) : reject(new Error('画像の変換に失敗しました')), 'image/jpeg', quality);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('画像を読み込めませんでした（HEIC形式などは非対応の場合があります）')); };
      img.src = url;
    });
  }

  async function uploadPhoto(e) {
    const file = e.target.files[0]; if (!file) return;
    try {
      showToast('画像を処理中...');
      const blob = await resizeImage(file);   // どんな大きさの写真でも縮小してから送る
      showToast('アップロード中...');
      const path = `users/${targetUid}/photo_${Date.now()}.jpg`;
      const sref = ref(storage, path);
      await uploadBytes(sref, blob, { contentType: 'image/jpeg' });
      const url = await getDownloadURL(sref);
      await updateDoc(doc(db, 'users', targetUid), { photoURL: url });
      user.photoURL = url; render();
      showToast('写真を更新しました');
    } catch (err) {
      console.error('photo upload error', err);
      showToast('アップロード失敗：' + (err.code || err.message));
    }
  }

  function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
</script>
</body>
</html>
